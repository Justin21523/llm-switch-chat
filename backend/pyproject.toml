[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-switch-chat"
version = "1.0.0"
description = "Multi-backend LLM chat API with RAG support"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
keywords = ["llm", "chat", "fastapi", "rag", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",

    # Optional dependencies for different backends
    "transformers>=4.35.0",
    "torch>=2.0.0",
    "accelerate>=0.24.0",

    # RAG dependencies
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.0",

    # UI
    "gradio>=4.0.0",

    # Utilities
    "numpy>=1.24.0",
]

[project.optional-dependencies]
# llama.cpp backend
llamacpp = [
    "llama-cpp-python>=0.2.0",
]

# GPU support
gpu = [
    "faiss-gpu>=1.7.0",
]

# OpenAI backend
openai = [
    "openai>=1.3.0",
]

# Development dependencies
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]

# All dependencies
all = [
    "llama-cpp-python>=0.2.0",
    "faiss-gpu>=1.7.0",
    "openai>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/llm-switch-chat"
Repository = "https://github.com/yourusername/llm-switch-chat"
Issues = "https://github.com/yourusername/llm-switch-chat/issues"

[project.scripts]
llm-chat-api = "app.main:main"
llm-chat-ui = "app.ui.gradio_app:main"

[tool.setuptools]
package-dir = {"" = "backend"}
packages = ["app"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json"]

# Black configuration
[tool.black]
line-length = 100
target-version = ['py38']
include = '\.pyi?# LLM Switch Chat - 完整實作代碼

