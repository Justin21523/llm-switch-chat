# Default application configuration
# These values can be overridden by environment variables

# API Configuration
api:
  host: "0.0.0.0"
  port: 8000
  debug: false

# Model Configuration
model:
  backend: "hf" # hf, llamacpp, openai
  id: "Qwen/Qwen2-7B-Instruct"

  # Backend-specific settings
  hf:
    device: "auto"
    torch_dtype: "auto"

  llamacpp:
    n_ctx: 4096
    n_gpu_layers: -1

  openai:
    base_url: null
    api_key: "sk-default"

# Generation Settings
generation:
  max_tokens: 1024
  temperature: 0.7
  top_p: 0.9

# RAG Configuration
rag:
  enabled: false
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  vector_store_path: "./data/vectorstore"
  top_k: 5
